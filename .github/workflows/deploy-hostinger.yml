name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (static export)
        run: npm run build

      - name: Verificar artefactos SEO en out/
        run: |
          rm -rf "out/_next 2" 2>/dev/null || true
          test -f out/index.html
          ! grep -q 'Conocé el club' out/index.html
          grep -q 'Conocer el Club' out/index.html
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/og-matchpoint.jpg
          test -f out/mario-tomczuk-presentacion.jpg
          test -f out/manifest.webmanifest
          test -f out/.htaccess
          test -f out/icons/apple-touch-icon.png
          test -f out/icons/icon-512.png
          test -f out/404.html
          grep -q 'application/ld+json' out/index.html
          grep -q 'rel="canonical"' out/index.html
          grep -q 'og-matchpoint.jpg' out/index.html

      - name: Prepare FTP server directory
        id: ftp_dir
        env:
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          if [ -z "$FTP_SERVER_DIR" ]; then
            echo "::error::Falta el secret FTP_SERVER_DIR (para Hostinger con cuenta FTP del dominio, suele ser /)"
            exit 1
          fi
          dir="${FTP_SERVER_DIR%/}/"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ steps.ftp_dir.outputs.dir }}
          # Hostinger: suele funcionar ftp; si falla, cambiar a ftps en el workflow.
          protocol: ftps
          port: 21
          timeout: 120000
          dangerous-clean-slate: false
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Verificar que la web pública se actualizó
        run: |
          check_ok=0
          for i in 1 2 3 4 5 6; do
            html="$(curl -sfL "https://matchpointmvd.com/")" || true
            og="$(curl -sfI "https://matchpointmvd.com/og-matchpoint.jpg" | head -1)" || true
            mario="$(curl -sfI "https://matchpointmvd.com/mario-tomczuk-presentacion.jpg" | head -1)" || true
            robots="$(curl -sfI "https://matchpointmvd.com/robots.txt" | head -1)" || true
            if echo "$html" | grep -q "logo-lockup-green" \
              && echo "$html" | grep -qv "Conocé el club" \
              && echo "$html" | grep -q "Conocer el Club" \
              && echo "$html" | grep -q "og-matchpoint.jpg" \
              && echo "$og" | grep -q "200" \
              && echo "$mario" | grep -q "200" \
              && echo "$robots" | grep -q "200"; then
              echo "OK: sitio, OG, foto fundador y robots.txt en producción."
              check_ok=1
              break
            fi
            echo "Esperando ($i/6)... og=$og robots=$robots"
            sleep 15
          done
          if [ "$check_ok" -ne 1 ]; then
            echo "::error::El FTP terminó pero faltan archivos en producción (OG, mario, robots o HTML SEO). Revisá FTP_SERVER_DIR=/ (no /public_html/) y volvé a ejecutar el workflow."
            exit 1
          fi
